version: 2
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/cloud.lazycat.app.rsshub.lpk
  target_arch: amd64
source:
  kind: git
  url: https://github.com/DIYgod/RSSHub.git
  select:
    strategy: release
    channel: stable
    # RSSHub publishes date/build/short-commit stable releases, not ordinary
    # x.y.z releases. The suffix is NOT a prerelease. Map year.month.run_number
    # to SemVer, compare numerically (9 < 10), preserve full tag and peeled SHA.
    # Match precisely; never fall back to master/latest/daily mutable images.
    tag_regex: '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+\.[a-f0-9]{7}$'
    version_regex: '^v(?P<version>(?P<year>[0-9]{4})\.(?P<month>[0-9]{2})\.[0-9]{2}-(?P<build>[0-9]+)\.[a-f0-9]{7})$'
    version_template: '{year}.{month}.{build}'
changelog:
  mode: command
  command: python3 -B scripts/upstream.py changelog
state:
  file: .lazycat-action.lock.yml
update:
  strategy: publish
  allow_downgrade: false
build:
  run_buildscript: true
  prepare:
    mode: command
    context: scripts
    command: |
      python3 -m pip install --disable-pip-version-check -r requirements-test.txt
      python3 -B scripts/verify_runtime.py
    # The command tests this full-commit image. Preparation then exposes that
    # SAME image to the generic delivery pipeline; no 7/12-char SHA truncation.
    output_image: 'ghcr.io/diygod/rsshub:chromium-bundled-{source_revision}'
images:
  - id: rsshub
    target: service
    service: rsshub
    source: ghcr.io/diygod/rsshub
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    create_if_missing: false
    skip_if_version_exists: true
    continue_if_newer_version: true
    retry:
      enabled: true
      max_attempts: 5
      initial_delay: 2s
      max_delay: 30s
